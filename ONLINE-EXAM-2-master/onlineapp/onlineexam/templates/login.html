{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>register form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css\login.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Lora:ital,wght@0,400..700;1,400..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <section>
        <div class="container">
            <div class="row">
                
                {% for message in messages   %}
                <div class="alert alert-danger" role="alert">
                   {{message}}
                  </div>
                {% endfor %}
                    
                <div class="col-md-6 block ">
                <form action="{% url 'adminlogin' %}" method ='post'>
                       {% csrf_token %}
                       <br><br>
                    <h2> Login as Teacher </h2><br>
                    
                    <input type="text" name="uname" id="" placeholder="Enter your user name">
                    <br><br>
                    <input type="password" name="pwd" id=""placeholder="Enter your password">
                    <br><br> 
                    
                    
                    <input type="submit" class="btn btn-outline-dark"  role="button" value="login"><br><br>
                    
                </form>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row ">
                <div class="col-md-6 blocks ">
                <form action="{% url 'studentlogin' %}" method="post"><br><br>
                    {% csrf_token %}
                    <h2> Login as Student</h2><br>
                    
                    <input type="text" name="uname" id="" placeholder="Enter your Register Number">
                    <br><br>
                    <input type="password" name="pwd" id=""placeholder="Enter your password">
                    <br><br> 
                

                    
                    <input type="submit" class="btn btn-outline-dark"  role="button" value="login"><br><br>
                    
                </form>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
