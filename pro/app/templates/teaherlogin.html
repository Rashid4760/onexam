<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="{% url "tlogindash" %}" method="POST">
        {% csrf_token %}
        <div class="container">
            <h1>Teacher Login</h1>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="tusername" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="tpassword" required>
            </div>
            <button type="submit" class="btn btn-primary">Login</button>
        </div>
    </form>
</body>
</html>
